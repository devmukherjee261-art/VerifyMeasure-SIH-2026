<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <meta name="api-base-url" content="">

    <link rel="stylesheet"
          href="css/style.css">

    <!-- config.js and script.js are deliberately at the end of <body>: the
         form handler looks elements up as it runs, and loading it from <head>
         would execute before the form exists. -->

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            ⚖️ VerifyMeasure
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <div class="form-page">

        <div class="form-card">

            <h2>Create Account</h2>

            <p class="form-subtitle">
                Register an applicant account
            </p>


            <form id="signupForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Optional"
                    autocomplete="name"
                    maxlength="150"
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmSignupPassword"
                    placeholder="Repeat the password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    required
                >


                <button type="submit" class="form-btn">

                    Create Account

                </button>

            </form>

            <p id="signupMessage" role="alert" style="color: #b91c1c;"></p>


            <a href="login.html" class="form-alt-btn">

                Already have an account? Sign in

            </a>

        </div>

    </div>


    <script src="js/config.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
